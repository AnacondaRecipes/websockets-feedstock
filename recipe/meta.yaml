{% set name = "websockets" %}
{% set version = "17.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://files.pythonhosted.org/packages/30/4b/4692be6d5bf739ed049b3813901c42091f8c054df89d5c089343823dea0d/websockets-17.3.tar.gz
    sha256: 1c7dd93a1c9f89297471493674b1fc1d9467cafd45374f2172213046bdb3a329
  - url: https://github.com/python-websockets/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
    sha256: f80496c1d689e629c184055e15e27734251c7214841d486428c15bed185162ee
    folder: gh

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - websockets = websockets.cli:main

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

{% set ignore_tests = "" %}
# OSError: [Errno 99] error while attempting to bind on address ('::1', 0, 0, 0): cannot assign requested address
{% set ignore_tests = "--ignore=gh/tests/legacy/test_auth.py" %}  # [linux]
{% set ignore_tests = ignore_tests + " --ignore=gh/tests/legacy/test_client_server.py" %}  # [linux]
{% set ignore_tests = ignore_tests + " --ignore=gh/tests/asyncio/test_client.py" %}  # [linux]
{% set ignore_tests = ignore_tests + " --ignore=gh/tests/asyncio/test_server.py" %}  # [linux]
{% set ignore_tests = ignore_tests + " --ignore=gh/tests/asyncio/test_router.py" %}  # [linux]
{% set ignore_tests = ignore_tests + " --ignore=gh/tests/sync/test_connection.py" %}  # [osx]
# Flaky upstream test on osx-arm64 (2 of 5 runs in graph 146762fe, py3.11 and py3.12,
# passed on linux-64/linux-aarch64 and on py3.13+): tests/sync/test_client.py::test_reconnect
# races the server's first-iteration sleep(3*MS) against the client's open_timeout=3*MS,
# so the first connection sometimes opens and the test sees 3 successful reconnects
# instead of 2 (AssertionError: 3 != 2 at test_client.py:220). Upstream still asserts
# the same counts in 17.4, so deselect instead of patching the test.
{% set ignore_tests = ignore_tests + " --deselect=gh/tests/sync/test_client.py::ClientTests::test_reconnect" %}  # [osx and arm64]
test:
  source_files:
    - gh/tests
  imports:
    - websockets
    - websockets.asyncio
    - websockets.cli
    - websockets.client
    - websockets.datastructures
    - websockets.exceptions
    - websockets.frames
    - websockets.headers
    - websockets.http11
    - websockets.imports
    - websockets.legacy
    - websockets.protocol
    - websockets.server
    - websockets.streams
    - websockets.sync
    - websockets.typing
    - websockets.uri
    - websockets.utils
    - websockets.version
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # osx-arm64 CI workers are slow and noisy, and the suite's timing unit is
    # MS = 1ms * WEBSOCKETS_TESTS_TIMEOUT_FACTOR. Upstream recommends raising this
    # factor on build farms and does it automatically for released builds
    # (https://github.com/python-websockets/websockets/issues/1509). At the default
    # the timing tests still race here: test_keepalive_is_enabled (sync) failed with
    # "AssertionError: 0.0 not greater than 0" at tests/sync/test_client.py:156 in
    # graph d8f66fae-0d58-441f-8bbd-d8ddf28494b7, osx-arm64 py3.15 only.
    - export WEBSOCKETS_TESTS_TIMEOUT_FACTOR=500  # [osx and arm64]
    # Tests on Windows randomly hang or fail to start without any issue.
    - pytest {{ ignore_tests }} -v gh/tests  # [unix]
    - websockets --version
  requires:
    - pip
    - pytest
    - trio
    - werkzeug

about:
  home: https://websockets.readthedocs.io
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: websockets is a library for building WebSocket servers and clients in
    Python with a focus on correctness, simplicity, robustness, and performance.
  description: |
    websockets is a library for building WebSocket servers and clients in Python with a focus on correctness, simplicity, robustness, and performance.
    It supports several network I/O and control flow paradigms.
    The default implementation builds upon asyncio, Python’s built-in asynchronous I/O library.
    It provides an elegant coroutine-based API. It’s ideal for servers that handle many client connections.
    The threading implementation is a good alternative for clients, especially if you aren’t familiar with asyncio.
    It may also be used for servers that handle few client connections.
    The Sans-I/O implementation is designed for integrating in third-party libraries,
    typically application servers, in addition being used internally by websockets.
  doc_url: https://websockets.readthedocs.io
  dev_url: https://github.com/python-websockets/websockets

extra:
  recipe-maintainers:
    - scopatz
    - ocefpaf
